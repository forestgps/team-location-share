name: 서명 키 만들기

# 앱 서명 키(keystore)를 GitHub 서버에서 만들어 준다.
# 이 PC 에 JDK 를 설치할 필요가 없다.
#
# 왜 필요한가
#   안드로이드는 같은 키로 서명된 APK 만 같은 앱의 업데이트로 인정한다.
#   지금처럼 디버그 서명으로 배포하면 다음 버전을 설치할 때 기존 앱 위에 덮이지 않는다.
#   한 번 만든 키를 계속 쓰면 업데이트가 정상으로 이어진다.
#
# 쓰는 방법
#   1. Actions 탭 -> 서명 키 만들기 -> Run workflow
#   2. 끝나면 Artifacts 의 signing-key 를 내려받는다 (zip 안에 4개 파일)
#   3. Settings -> Secrets and variables -> Actions 에 아래 4개를 등록한다
#        KEYSTORE_BASE64    keystore.base64.txt 내용 전체
#        KEYSTORE_PASSWORD  password.txt 내용
#        KEY_ALIAS          teamloc
#        KEY_PASSWORD       password.txt 내용 (같은 값)
#   4. 내려받은 zip 은 안전한 곳에 보관한다. 잃어버리면 앱 업데이트를 낼 수 없다.
#   5. 등록 후 Android APK 워크플로를 다시 돌리면 서명된 APK 가 나온다
#
# 암호는 이 워크플로가 무작위로 만든다. 로그에는 남지 않고 결과 파일에만 들어간다.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest

    steps:
      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 키 생성
        run: |
          set -e
          mkdir -p out

          # 암호를 무작위로 만든다. 화면과 로그에 출력하지 않는다.
          PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)"
          ALIAS="teamloc"

          keytool -genkeypair \
            -keystore out/release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10950 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Team Location Share, OU=Field, O=Team, L=Seoul, C=KR" \
            >/dev/null 2>&1

          printf '%s' "$PASSWORD" > out/password.txt
          printf '%s' "$ALIAS" > out/alias.txt
          base64 -w 0 out/release.keystore > out/keystore.base64.txt

          # 사이트 소유 증명(assetlinks.json)에 넣을 지문을 뽑는다.
          FINGERPRINT="$(keytool -list -v -keystore out/release.keystore -alias "$ALIAS" \
            -storepass "$PASSWORD" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ' \r')"

          cat > out/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "kr.teamloc.share",
                "sha256_cert_fingerprints": ["$FINGERPRINT"]
              }
            }
          ]
          EOF

          cat > out/README.txt <<'EOF'
          이 폴더의 파일은 앱 서명 키입니다. 잃어버리면 앱 업데이트를 배포할 수 없습니다.
          안전한 곳(암호 관리자, 오프라인 저장매체)에 보관하세요.

          저장소 Settings -> Secrets and variables -> Actions 에 등록할 값

            KEYSTORE_BASE64    keystore.base64.txt 의 내용 전체
            KEYSTORE_PASSWORD  password.txt 의 내용
            KEY_ALIAS          alias.txt 의 내용 (teamloc)
            KEY_PASSWORD       password.txt 의 내용 (위와 같은 값)

          assetlinks.json 은 저장소의 .well-known/ 폴더에 넣고 push 하면
          앱에서 사이트 링크를 열 때 브라우저 선택 창이 뜨지 않습니다.

          등록을 마치면 이 zip 파일은 GitHub 에서 삭제하고 개인 보관본만 남기세요.
          EOF

          ls -l out
          echo "키를 만들었습니다. Artifacts 의 signing-key 를 내려받으세요."

      - name: 결과 올리기
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out/
          retention-days: 1

      - name: 안내
        run: |
          {
            echo "## 서명 키를 만들었습니다"
            echo ""
            echo "Artifacts 의 **signing-key** 를 내려받으세요. 보관 기간은 1일입니다."
            echo ""
            echo "zip 안의 README.txt 대로 저장소 Secrets 에 4개 값을 등록하면,"
            echo "이후 Android APK 워크플로가 서명된 APK 를 만듭니다."
            echo ""
            echo "암호는 로그에 남기지 않았습니다. password.txt 에만 들어 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"

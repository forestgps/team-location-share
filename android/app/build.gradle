plugins {
    id 'com.android.application'
}

// 서명 정보는 keystore.properties 에서 읽는다(저장소에 커밋하지 않는다).
// GitHub Actions 에서는 저장소 Secrets 에서 이 파일을 만들어 준다.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'kr.teamloc.share'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.teamloc.share'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4.0'
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
    }
}

dependencies {
    // Kotlin 표준 라이브러리 버전을 한 줄로 통일한다.
    //
    // appcompat 은 kotlin-stdlib 1.8.22 를, 그 하위 의존성은 kotlin-stdlib-jdk7/jdk8 1.6.21 을
    // 끌고 온다. 1.8 부터 jdk7/jdk8 모듈의 내용이 kotlin-stdlib 안으로 합쳐졌기 때문에
    // 버전이 어긋나면 같은 클래스가 두 번 들어가 빌드가 실패한다(checkDuplicateClasses).
    // BOM 으로 세 모듈의 버전을 맞추면 jdk7/jdk8 은 빈 껍데기가 되어 충돌이 사라진다.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'

    // 백그라운드 서비스에서 쓸 MQTT 클라이언트. wss(WebSocket over TLS) 를 지원한다.
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}

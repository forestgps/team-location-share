<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>팀 위치 공유 초대</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0f1115; color: #e7e9ee; padding: 24px; text-align: center;
      font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    }
    .box { background: #171a21; border: 1px solid #2b303b; border-radius: 14px; padding: 28px; max-width: 430px; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    p { color: #9aa3b2; font-size: 13px; line-height: 1.7; }
    a { color: #4c9aff; word-break: break-all; font-size: 15px; }
    #qr { background: #fff; padding: 12px; border-radius: 10px; display: inline-block; margin: 18px 0; min-height: 220px; }
    .warn { color: #ffb020; }
  </style>
</head>
<body>
  <div class="box">
    <h1>팀 실시간 위치 공유 초대</h1>
    <p>
      휴대폰 카메라로 QR을 스캔하거나 아래 주소로 접속하세요.<br />
      같은 wifi가 아니어도, LTE/5G 등 다른 통신망에서도 접속됩니다.
    </p>
    <div id="qr"></div>
    <p><a id="link" href="#">주소를 불러오는 중…</a></p>
    <p id="source" class="warn"></p>
    <p id="broker-row" hidden>
      <label>
        <input id="with-broker" type="checkbox" />
        자체 브로커 설정도 QR에 담기
      </label>
      <br />
      <span id="broker-note" class="warn"></span>
    </p>
    <p>
      접속한 뒤 <strong>같은 소속팀 이름</strong>과 <strong>같은 팀 암호</strong>를
      입력한 대원끼리만 서로의 위치가 보입니다. 팀 암호는 QR이나 링크에 담기지 않으니
      별도 경로로 대원들에게 전달하세요.
    </p>
  </div>

  <script src="public-url.js"></script>
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      // 상시 운영 주소(GitHub Pages)를 기본으로 쓰고,
      // 로컬에서 share.ps1 로 임시 터널을 띄운 경우에는 그 주소를 우선한다.
      var LIVE_URL = "https://forestgps.github.io/team-location-share/";
      var tunnel = window.PUBLIC_URL;
      var url = tunnel || LIVE_URL;

      var link = document.getElementById("link");
      document.getElementById("source").textContent = tunnel
        ? "임시 터널 주소입니다. PC에서 share.ps1 이 실행 중일 때만 살아 있습니다."
        : "상시 운영 주소입니다. 언제든 접속할 수 있습니다.";

      // 이 기기에 저장된 자체 브로커 설정. 있으면 QR 에 담을지 고를 수 있게 한다.
      // 팀 암호는 담지 않는다(브로커 자격과 팀 암호는 다른 것이다).
      var profile = null;
      try {
        profile = JSON.parse(localStorage.getItem("rtloc.profile.v2") || "null");
      } catch (e) {
        profile = null;
      }
      var hasBroker = !!(profile && profile.broker);

      var qr = new QRCode(document.getElementById("qr"), {
        text: url,
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.M
      });

      function targetUrl(withBroker) {
        if (!withBroker || !hasBroker) return url;
        var query =
          "?b=" + encodeURIComponent(profile.broker) +
          (profile.brokerUser ? "&u=" + encodeURIComponent(profile.brokerUser) : "") +
          (profile.brokerPass ? "&p=" + encodeURIComponent(profile.brokerPass) : "");
        return url + query;
      }

      function render(withBroker) {
        var next = targetUrl(withBroker);
        link.textContent = next;
        link.href = next;
        qr.clear();
        qr.makeCode(next);
      }

      render(false);

      if (hasBroker) {
        var row = document.getElementById("broker-row");
        var box = document.getElementById("with-broker");
        row.hidden = false;
        document.getElementById("broker-note").textContent =
          "브로커 주소와 아이디·암호가 QR 에 들어갑니다. 팀 밖으로 새지 않게 조심하세요.";
        box.addEventListener("change", function () {
          render(box.checked);
        });
      }
    })();
  </script>
</body>
</html>
